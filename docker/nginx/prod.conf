# Production: the nginx container holds no application files; every request is
# handed to PHP-FPM, which owns the code (see docker-compose.prod.yml).
server {
    # Re-resolve php on every request so recreating the php container does not leave nginx with a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    listen 80;
    server_name _;
    root /var/www/html/public;
    server_tokens off;
    charset utf-8;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Probes: passed straight to the front controller, kept out of the access log.
    location ~ ^/(health|ready)$ {
        access_log off;
        include fastcgi_params;
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 5s;
    }

    location / {
        include fastcgi_params;
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

name: Backend

# Runs on every push and pull request to main and develop, and on demand (workflow_dispatch).
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.5"

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: make setup
      - run: make lint

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: make setup
      - run: make typecheck

  pest:
    name: Pest with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          tools: composer:v2
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: make setup
      - run: make coverage

  audit:
    name: Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - run: composer audit

  gga:
    name: Guardian Angel review
    # Reviews the files changed in the last commit. Skipped, with a notice, until ANTHROPIC_API_KEY is set.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Skip without an API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY is not set, so the Guardian Angel review is skipped."
      - name: Install the Claude Code CLI (the configured provider)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Install Guardian Angel
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          git clone https://github.com/Gentleman-Programming/gentleman-guardian-angel.git "$RUNNER_TEMP/gga" && git -C "$RUNNER_TEMP/gga" checkout --quiet fbf1091da170a33d42cb97577a9813e652e98a4a
          (cd "$RUNNER_TEMP/gga" && ./install.sh)
          for dir in "$HOME/bin" /usr/local/bin "$HOME/.local/bin"; do [[ -x "$dir/gga" ]] && echo "$dir" >> "$GITHUB_PATH" && break; done
      - name: Review the last commit
        if: env.ANTHROPIC_API_KEY != ''
        run: gga run --ci
